name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # as CLAUDE.md runs the suites: the ones that import the skill in-process must not leave a
  # __pycache__ beside its scripts (it is listed to agents, and environment.py looks for one)
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    # pyflakes rules and the oldest Python the skill promises (3.8). Known defects are tagged with
    # `noqa`, so a new mistake turns the job red at once.
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff (pyflakes rules) and vermin (Python 3.8)
        shell: bash
        run: |
          python -m pip install --quiet --disable-pip-version-check ruff vermin
          ruff check --select F scripts tests
          vermin --target=3.8- --violations --no-tips --eval-annotations scripts tests

  offline:
    # The suites that need no network: they pin the contract, the setup advice and every 0.4.x fix.
    # The live suites (cases, corpus) stay manual: they depend on third parties.
    name: offline (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install optional engines
        shell: bash
        run: |
          python -m pip install --quiet --disable-pip-version-check trafilatura html2text \
            pymupdf python-docx openpyxl python-pptx pillow psutil curl_cffi
          # yt-dlp and tesseract stay optional: the suites skip what is missing

      - name: the CLI answers --version, --caps and the setup report
        shell: bash
        run: |
          python -X utf8 scripts/readpage.py --version
          python -X utf8 scripts/readpage.py --caps
          python -X utf8 scripts/readpage.py

      # every suite runs even when an earlier one failed (the job still fails): a red step used to
      # hide all later suites, and on Linux security and the rest had not run for ten days
      - name: reading (encodings, dead hosts and 5xx to readers, video pages, Jina by POST, urllib)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/reading.py

      - name: sources (the readers in order, keys to their own service, the site APIs and their fallback)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/sources.py

      - name: blocks (what the extractor dropped goes back in place; menus stay out)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/blocks.py

      - name: images (numbered markers in place, the printed view's pictures, hard links between pages)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/images.py

      - name: speed (a cached answer asks nothing, caps kept until PATH changes, cookie lock, the disk floor)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/speed.py

      - name: MCP in parallel (four calls at once, cancel kills the call, which pictures become image blocks)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/mcp_parallel.py

      - name: timeouts (every step bounded, a trickle ends, one browser, a dropped connection)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/timeouts.py

      - name: deadline (55 s a read, defuddle worker, extractors that can be stopped, huge pages, warm MCP)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/deadline.py

      - name: formats (RTF and ODT by content, a local file, pymupdf4llm, YouTube pages)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/formats.py

      - name: statuses (codes, walls in twenty languages, cut transfers, the cache)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/statuses.py

      - name: security (only http(s), no way into the local network, readers, cache)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/security.py

      - name: the answer contract (budget, outline, --from, exit codes)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/contract.py

      - name: property suite
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PROPS_TRACE: "1"
        run: python -X utf8 tests/props.py

      - name: fix suite
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/fixes.py

      - name: main HTTP channel offline (curl_cffi against a local server)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/channel.py

      - name: office fixtures (docx/xlsx/pptx)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/office_fixtures.py

      - name: our EPUB, ODT and RTF readers (what they keep; hostile files in a child, past time or memory)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/docreaders.py

      - name: MCP protocol smoke
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/mcp_smoke.py

      - name: linux desktop wrappers (snap, flatpak)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo mkdir -p /snap/bin /var/lib/flatpak/exports/bin
          sudo touch /snap/bin/chromium /var/lib/flatpak/exports/bin/com.google.Chrome
          sudo chmod +x /snap/bin/chromium /var/lib/flatpak/exports/bin/com.google.Chrome

      - name: setup advice, empty machine and full machine
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/setup_audit.py

      - name: the skill's own environment (a fake one; --setup offline and while another runs)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/environment.py

  browser:
    # The browser tier on all three systems: the one thing Windows-only testing cannot prove.
    # macOS lives in macos.yml, started by hand before a release.
    name: browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Playwright and its Chromium
        shell: bash
        run: |
          python -m pip install --quiet --disable-pip-version-check playwright pymupdf
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi

      - name: the browser tier reads a shell, waits for a late mount, carries the session
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tests/browser_live.py
