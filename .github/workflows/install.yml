name: install

# Real installs. tests.yml runs the offline suites on a few pip packages; nothing there ever ran what a
# user runs, `readpage.py --setup`, on the systems users have. The repository is public, so every
# standard runner is free: Linux, Windows and macOS, x64 and arm64 (runner labels: GitHub's runner-images
# README; `-large` and `-xlarge` are paid and not used). tools/ci_install.py holds what the jobs measure
# and assert; what a platform lacks for want of wheels is listed in its matrix row (`expect`), so a gap
# that is not listed turns the job red, and a listed one is a floor README and KNOWN-ISSUES name.
# Runs on dev and ci-install pushes (the workflows live on those branches: `main` is the skill alone),
# and by hand.
on:
  push:
    branches: [dev, ci-install]
  workflow_dispatch:

# a newer push replaces the run of an older one on the same branch
concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

env:
  # a __pycache__ beside the scripts would be listed to agents, and the suites import them
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  setup:
    # From nothing, into a folder with a space and Cyrillic letters in its path (the review of --setup
    # asked for exactly that): the setup, every engine checked, the offline suites under the
    # environment's own Python, then --setup again, which must have nothing to fetch.
    name: setup (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI_EXPECT_MISSING: ${{ matrix.expect }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64, os: ubuntu-24.04, expect: ""}
          - {name: linux-arm64, os: ubuntu-24.04-arm, expect: ""}
          - {name: windows-x64, os: windows-2025, expect: ""}
          - {name: windows-arm64, os: windows-11-arm, expect: ""}
          - {name: macos-15-arm64, os: macos-15, expect: ""}
          - {name: macos-26-arm64, os: macos-26, expect: ""}
          - {name: macos-15-x64, os: macos-15-intel, expect: ""}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: the machine, and a fresh READ_PAGE_HOME (a space and Cyrillic in its path)
        shell: bash
        run: |
          python -X utf8 tools/ci_install.py machine
          python -X utf8 tools/ci_install.py home

      - name: --setup from nothing (as an agent runs it; time, download, disk)
        shell: bash
        run: python -X utf8 tools/ci_install.py setup --label first --follow

      - name: what it built (every step and engine; what is missing is named, with its fix)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tools/ci_install.py check

      - name: the setup report and --caps
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python -X utf8 scripts/readpage.py | tee "$RUNNER_TEMP/ci-logs/setup-report.txt"
          python -X utf8 scripts/readpage.py --caps | tee "$RUNNER_TEMP/ci-logs/caps.json"

      - name: reads (a local file, a public page, a scanned PDF through OCR)
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tools/ci_install.py read --ocr

      - name: the offline suites and the browser suite, under the environment's Python
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tools/ci_install.py suites

      - name: "--setup once more (nothing to fetch, so quick)"
        if: ${{ !cancelled() }}
        shell: bash
        run: python -X utf8 tools/ci_install.py setup --label second --max-seconds 120 --max-mb 50

      - name: the folder's contents, and the summary
        if: ${{ always() }}
        shell: bash
        run: |
          python -X utf8 tools/ci_install.py collect
          python -X utf8 tools/ci_install.py summary --title "setup ${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: install-logs-setup-${{ matrix.name }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn

  user-install:
    # A user's own path: README's Install section, word for word - the public repository cloned into the
    # skills folder, `--setup` into the default folder, then a read. `main` is what a user gets; `commit`
    # is the same skill from the pushed commit, so a fix is seen here before main has it. The Python is
    # the one the OS gives a user (macOS: Apple's 3.9, which has no tar filters), PowerShell on Windows.
    name: user install (${{ matrix.name }}, ${{ matrix.source }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI_EXPECT_MISSING: ${{ matrix.expect }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux, os: ubuntu-24.04, python: python3, shell: bash, source: main, expect: ""}
          - {name: linux, os: ubuntu-24.04, python: python3, shell: bash, source: commit, expect: ""}
          - {name: windows, os: windows-2025, python: python, shell: pwsh, source: main, expect: ""}
          - {name: windows, os: windows-2025, python: python, shell: pwsh, source: commit, expect: ""}
          - {name: macos, os: macos-15, python: /usr/bin/python3, shell: bash, source: main, expect: ""}
          - {name: macos, os: macos-15, python: /usr/bin/python3, shell: bash, source: commit, expect: ""}
    steps:
      # the checkout is only for tools/ci_install.py; the skill is what README's command clones
      - uses: actions/checkout@v4
        with:
          path: ci

      - name: 1. put the folder where the agent looks (README's command)
        run: git clone https://github.com/Elexort/read-page $HOME/.agents/skills/read-page

      - name: 1b. the pushed commit instead of main's head
        if: ${{ matrix.source == 'commit' }}
        run: git -C $HOME/.agents/skills/read-page checkout ${{ github.sha }}

      - name: the machine
        run: ${{ matrix.python }} -X utf8 ci/tools/ci_install.py machine

      - name: 2. --setup (README's command, asked again while it goes on, as an agent does)
        run: ${{ matrix.python }} -X utf8 ci/tools/ci_install.py setup --follow --python ${{ matrix.python }} --skill $HOME/.agents/skills/read-page

      - name: what it built
        if: ${{ !cancelled() }}
        run: ${{ matrix.python }} -X utf8 ci/tools/ci_install.py check --skill $HOME/.agents/skills/read-page

      - name: 3. read a local file and a public page
        if: ${{ !cancelled() }}
        run: ${{ matrix.python }} -X utf8 ci/tools/ci_install.py read --python ${{ matrix.python }} --skill $HOME/.agents/skills/read-page --ocr

      - name: the folder's contents, and the summary
        if: ${{ always() }}
        run: |
          ${{ matrix.python }} -X utf8 ci/tools/ci_install.py collect --skill $HOME/.agents/skills/read-page
          ${{ matrix.python }} -X utf8 ci/tools/ci_install.py summary --title "user install ${{ matrix.name }} ${{ matrix.source }}"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: install-logs-user-${{ matrix.name }}-${{ matrix.source }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn

  bare:
    # A Python with nothing in it and no --setup: the standard library core still answers, names
    # --setup, and reads a local file.
    name: bare (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux, os: ubuntu-24.04}
          - {name: windows, os: windows-2025}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "--version, --caps, the setup report and a local read: no packages, no --setup"
        shell: bash
        run: python -X utf8 tools/ci_install.py bare

  container:
    # A bare Linux: the image, Python and git, nothing else - no browser libraries. musl (Alpine) has
    # no wheels for some engines. --setup must not crash, and what it cannot do must be named, with the fix.
    name: container (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, os: ubuntu-24.04, image: "alpine:latest", expect: ""}
          - {arch: x64, os: ubuntu-24.04, image: "ubuntu:24.04", expect: ""}
          - {arch: arm64, os: ubuntu-24.04-arm, image: "alpine:latest", expect: ""}
          - {arch: arm64, os: ubuntu-24.04-arm, image: "ubuntu:24.04", expect: ""}
    steps:
      - uses: actions/checkout@v4

      - name: --setup inside the container
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/ci-logs:/logs" \
            -e CI_LOGS=/logs -e PYTHONDONTWRITEBYTECODE=1 -e GITHUB_STEP_SUMMARY=/logs/summary.md \
            -e CI_EXPECT_MISSING="${{ matrix.expect }}" \
            ${{ matrix.image }} sh /src/tools/ci_container.sh ${{ matrix.image }} "$GITHUB_SHA"

      - name: summary
        if: ${{ always() }}
        shell: bash
        run: cat "$RUNNER_TEMP/ci-logs/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: install-logs-container-${{ matrix.arch }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-logs
          if-no-files-found: warn
